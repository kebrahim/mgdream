name: Sync championship statuses

on:
  schedule:
    # Every 6 hours. Tighten this during playoffs if you want faster updates.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${SYNC_SECRET}" ]; then
            echo "APP_URL and/or SYNC_SECRET repo secrets aren't set yet — skipping (app likely not deployed yet)."
            exit 0
          fi
          curl -sf -X POST "${APP_URL}/api/sync" \
            -H "x-sync-secret: ${SYNC_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
