name: Sync championship statuses

on:
  schedule:
    # Every 6 hours. Tighten this during playoffs if you want faster updates.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sf -X POST "${APP_URL}/api/sync" \
            -H "x-sync-secret: ${SYNC_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
